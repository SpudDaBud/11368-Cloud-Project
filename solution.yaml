AWSTemplateFormatVersion: '2010-09-09'
Description: > #description that labels all of the services that are being deployed in this template
  AWS CloudFormation Template for Regional Sports Portal.
  Deploys a 2-AZ VPC, Public ALB, Private ASG (EC2), Private RDS, 
  S3 Buckets, SQS Queue, Lambda Image Resizer, Secrets Manager, and CloudWatch Dashboard/Alarm.

Parameters:
  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: CIDR block for the custom Virtual Private Cloud (VPC).

  DatabaseName:
    Type: String
    Default: 'sportsportal'
    Description: Initial relational database name for member and booking records.

  DBMasterUsername:
    Type: String
    Default: 'portaladmin'
    Description: Master administrative username for the RDS PostgreSQL database.

  LabRoleArn:
    Type: String
    Default: 'arn:aws:iam::123456789012:role/LabRole' # This uses the Lab Role that we were given for the project
    Description: >
      Pre-existing AWS Learner Lab IAM Role ARN. Required because 
      IAM role creation is restricted in Learner Lab environments.

  LabInstanceProfileName:
    Type: String
    Default: 'LabInstanceProfile' #This is more given context
    Description: Pre-existing Learner Lab Instance Profile attached to EC2 instances.

  LatestAmazonLinux2AMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: Latest Amazon Linux 2 AMI ID for this region.


#----------------------------------------------------------------------#
#Part One, Containing the VPC, Subnets, gateways and route tables
Resources:
  # VPC
  SportsPortalVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: SportsPortalVPC

  # Internet Gateway
  SportsPortalInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: SportsPortalInternetGateway
  
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SportsPortalVPC
      InternetGatewayId: !Ref SportsPortalInternetGateway

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SportsPortalVPC
      CidrBlock: '10.0.1.0/24'
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PublicSubnetAZ1
  
  PublicSubnet2:
    Type: AWS::EC2::Subnet 
    Properties:
        VpcId: !Ref SportsPortalVPC
        CidrBlock: '10.0.2.0/24'
        AvailabilityZone: !Select [ 1, !GetAZs '' ]
        MapPublicIpOnLaunch: true
        Tags:
          - Key: Name
            Value: PublicSubnetAZ2

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SportsPortalVPC
      CidrBlock: '10.0.10.0/24'
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: PrivateSubnetAZ1
  
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SportsPortalVPC
      CidrBlock: '10.0.20.0/24'
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: PrivateSubnetAZ2
  
  #Priavte Database Subnets
  PrivateDBSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SportsPortalVPC
      CidrBlock: '10.0.100.0/24'
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: PrivateDBSubnetAZ1
  
  PrivateDBSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SportsPortalVPC
      CidrBlock: '10.0.200.0/24'
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: PrivateDBSubnetAZ2

  #Elastic IP and NAT for outbound traffic from private subnets
  EIPNat:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EIPNat.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: NatGateway

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SportsPortalVPC
      Tags:
        - Key: Name
          Value: PublicRouteTable
  
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref SportsPortalInternetGateway

  SubnetRouteTableAssociationPublic1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  
  SubnetRouteTableAssociationPublic2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SportsPortalVPC
      Tags:
        - Key: Name
          Value: PrivateRouteTable
  
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  SubnetRouteTableAssociationPrivate1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  SubnetRouteTableAssociationPrivate2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable
  


#-----------------------------------------------------------------------#
#Part Two, Security Groups for the ALB, EC2 instances, and RDS database
  ALBSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for the Application Load Balancer (ALB)
        VpcId: !Ref SportsPortalVPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: '0.0.0.0/0'
  
  EC2SecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for the EC2 instances in the Auto Scaling Group (ASG)
        VpcId: !Ref SportsPortalVPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            SourceSecurityGroupId: !Ref ALBSecurityGroup
  
  DBSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for the RDS PostgreSQL database
        VpcId: !Ref SportsPortalVPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId: !Ref EC2SecurityGroup


#-----------------------------------------------------------------------#
#Part Three, Secrets Manager for generating and storing the DB password
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: SportsPortalDBSecret
      Description: Secret for RDS PostgreSQL database credentials
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DBMasterUsername}"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludePunctuation: true


#-----------------------------------------------------------------------#
#Part Four, Data base 

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS PostgreSQL database
      SubnetIds:
        - !Ref PrivateDBSubnet1
        - !Ref PrivateDBSubnet2
      Tags:
        - Key: Name
          Value: SportsPortalDBSubnetGroup


  DBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: "15"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Join
        - ''
        - - '{{resolve:secretsmanager:'
          - !Ref DBSecret
          - ':SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      MultiAZ: false #learner lab does not support multi-AZ deployments, so this is set to false
      PubliclyAccessible: false #Not accessible from the internet, only from the VPC
      BackupRetentionPeriod: 2556  #snap shots from the DB for retention for 7 years
      DeletionProtection: false #Allows the DB to be deleted when the stack is deleted

#-----------------------------------------------------------------------#
#Part Five, S3 Buckets for raw photo uploads and expire after 6 months
  RawPhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'sportsportal-raw-photos-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawPhotos
            Status: Enabled
            ExpirationInDays: 7

  #s3 bucket for resized images
  ResizedPhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'sportsportal-resized-photos-${AWS::AccountId}-${AWS::Region}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawPhotos
            Status: Enabled
            ExpirationInDays: 180 #expire after 6 months
  
  PhotoProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'sportsportal-photo-processing-queue-${AWS::AccountId}-${AWS::Region}'
      VisibilityTimeout: 60 #seconds, time for the Lambda to process the message before it becomes visible again
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PhotoProcessingDeadLetterQueue.Arn
        maxReceiveCount: 3

  PhotoProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'sportsportal-photo-processing-dead-letter-queue-${AWS::AccountId}-${AWS::Region}'

  #Lambda function to resize images asynchronously when they are uploaded to the raw photo bucket
  ImageResizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'sportsportal-image-resizer-${AWS::AccountId}-${AWS::Region}'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !Ref LabRoleArn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          RESIZED_BUCKET: !Ref ResizedPhotoBucket
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            console.log("Processing SQS photo resize event asynchronously:", JSON.stringify(event, null, 2));
            // Asynchronous resize logic simulation
            return { statusCode: 200, body: "Image resized and stored successfully" };
          };

  #connects the SQS queue to the Lambda function so that when a message is sent to the queue, the Lambda function is triggered
  LambdaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt PhotoProcessingQueue.Arn
      FunctionName: !GetAtt ImageResizerLambda.Arn
      Enabled: true

#-----------------------------------------------------------------------#
# Part Six, Application Load Balancer (ALB) and Auto Scaling Group (ASG) for the EC2 instances
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'sp-alb-${AWS::AccountId}'
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
  
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'sp-tg-${AWS::AccountId}'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref SportsPortalVPC
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      UnhealthyThresholdCount: 3
  
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t3.micro
        ImageId: !Ref LatestAmazonLinux2AMI
        IamInstanceProfile:
          Name: !Ref LabInstanceProfileName
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            amazon-linux-extras install -y nginx1
            systemctl enable nginx
            systemctl start nginx
            echo "<h1>Welcome to the Regional Sports Portal</h1>" > /usr/share/nginx/html/index.html

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: 2
      MaxSize: 6
      DesiredCapacity: 2
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
  
  AutoScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60.0

#-----------------------------------------------------------------------#
#Part Seven, CloudWatch Dashboard and Alarm for monitoring the ALB and EC2 instances
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'sportsportal-alarm-topic-${AWS::AccountId}-${AWS::Region}'

  CPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'sportsportal-cpu-alarm-${AWS::AccountId}-${AWS::Region}'
      AlarmDescription: Alarm when CPU exceeds 80% for 5 minutes
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AutoScalingGroup
      AlarmActions:
        - !Ref SNSTopic
  
  OperationDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'sportsportal-dashboard-${AWS::AccountId}-${AWS::Region}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AutoScalingGroup}" ]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "EC2 CPU Utilization"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ApplicationLoadBalancer}" ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "ALB Request Count"
              }
            }
          ]
        }

Outputs:
  PortalURL:
    Description: "URL of the Regional Sports Portal"
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
  
  RawPhotoBucketName:
    Description: "Name of the S3 bucket for raw photo uploads"
    Value: !Ref RawPhotoBucket

  SecretName:
    Description: "Name of the Secrets Manager secret for RDS credentials"
    Value: !Ref DBSecret